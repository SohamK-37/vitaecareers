server {
    listen 80; # Listen on port 80

    # Define the root directory where Nginx should look for files
    # This points to the VITAECAREER folder we copied inside the container
    root /usr/share/nginx/html/VITAECAREER;

    # Specify the default file to serve when a directory is requested (e.g., "/")
    index index.html index.htm;

    # Try serving files directly, then fall back to index.html for single-page apps (optional)
    location / {
        try_files $uri $uri/ =404;
    }
}